# Cargo configuration for iPhone 5 (ARMv7, iOS 10.x) build.
# This branch targets GTA III v1.x (32-bit armv7), rootful jailbreak.
# NOTE: Rust uses 'armv7s-apple-ios' (not 'armv7-apple-ios' which doesn't exist).

[target.armv7s-apple-ios]
rustflags = ["-C", "panic=abort"]

[unstable]
# Required for building std for tier-3 target armv7s-apple-ios
build-std = ["std", "panic_abort"]
